# SpotPredator Configuration File
# Simple configuration for your first Raspberry Pi + AI project

camera:
  resolution: [1920, 1080]  # Higher resolution for better training image quality
  framerate: 15
  rotation: 0  # Adjust if camera is mounted upside down

detector:
  model_path: "models/predator_arm_b_mix_v4_fp16.tflite"
  labels_path: "models/labels.txt"
  confidence_threshold: 0.8
  target_classes:
    - coyote
    - fox
    - raptor
  ignore_classes: []

hardware:
  camera:
    type: "arducam_module3"
  lora:
    module: "rylr998"
    uart_port: "/dev/serial0"
    baud_rate: 115200
    frequency: 915  # MHz (use 868 for EU)
    network_id: 18  # Change if you have multiple LoRa networks nearby
  rtc:
    module: "ds3231"
    i2c_address: 0x68
  stepper:
    enabled: true
    pins: [5, 6, 13, 19]  # ULN2003 IN1-IN4 (BCM)
    positions: 5  # 5 view positions: C, R1, R2, L1, L2 (2 each side of center)
    step_delay: 0.0015  # Seconds between steps
    steps_per_rev: 4096  # Half-steps per 360 deg — calibrate if rotation is off
    degrees_per_step: 72  # 360/5 for even full-circle coverage (66° HFOV → ~6° gap between positions)

alerts:
  lora_broadcast: true
  save_images: true
  image_path: "data/detections/"
  log_path: "data/logs/detections.log"

detection:
  check_interval: 0  # Seconds between cycles. 0 = no wait, run as fast as hardware allows (limit test). Raise to slow the scan / reduce heat.
  cooldown_period: 180  # Wait 3 minutes before alerting again for same animal type

  # False-positive filter: on a first-scan detection, nudge the turret toward the box (left tile ->
  # left, right tile -> right, middle -> both ways), rescan, return, and alert only if
  # (first conf + second conf) / 2 >= confidence_threshold.
  verify:
    enabled: true
    shift_degrees: 22        # ~one tile (66° camera FOV / 3) so the animal lands mid-frame
    detect_floor: 0.3        # lowest conf read on the rescan (so the average has a real number)
    settle_seconds: 1.5      # wait after each nudge before capturing
    edge_shift_degrees: 5    # at L2/R2, an outward rescan rotates only this far (cable twist limit)
    invert_direction: false  # set true if rescans rotate AWAY from the animal

  # Schedule: Only detect during these hours
  schedule_enabled: true  # Set to false to run 24/7
  start_hour: 6  # Start detection at 6:30 AM
  start_minute: 30
  end_hour: 20  # End detection at 8:00 PM (season change — dark ~8pm now)
  end_minute: 0
